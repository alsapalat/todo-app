<!doctype html>
<meta charset="utf-8" />
<title>todo-app browser check</title>
<!--
  Integration check for the parts unit tests cannot reach: the details sheet,
  the storage round trip, and what the list actually renders. Driven headlessly
  by `npm run check`; open it in a browser to watch the same run.
-->
<style>
  body { font: 14px ui-monospace, monospace; padding: 16px; }
  #result { white-space: pre; }
  iframe { width: 390px; height: 700px; border: 1px solid #ccc; }
</style>
<pre id="result">running…</pre>
<iframe id="f" title="app under test"></iframe>
<script>
const out = document.getElementById('result');
const log = [];
const ok = (name, cond) => log.push(`${cond ? 'PASS' : 'FAIL'} ${name}`);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

f.onload = async () => {
  try {
    const w = f.contentWindow;
    const d = f.contentDocument;
    const store = () => JSON.parse(w.localStorage.getItem('todo-app') || '{}')?.state?.tasks ?? [];
    const openDetails = async () => {
      d.querySelector('.item .body').click();
      await wait(50);
    };
    const saveSheet = async () => {
      d.querySelector('.sheet-foot .primary').click();
      await wait(80);
    };

    w.addEventListener('error', (e) => log.push(`FAIL uncaught: ${e.message}`));

    // Add through the real composer.
    d.getElementById('input').value = 'Round trip';
    d.getElementById('composer').dispatchEvent(new w.Event('submit', { cancelable: true }));
    await wait(50);
    ok('composer adds a task', store().length === 1 && store()[0].title === 'Round trip');
    ok('new task has no notes or date', store()[0].notes === '' && store()[0].due === null);

    // Edit everything in the details sheet.
    await openDetails();
    ok('details sheet opens', d.getElementById('details').open === true);

    d.getElementById('d-title').value = '  Round trip renamed  ';
    d.getElementById('d-notes').innerHTML = '<div>hello <b>world</b></div><script>bad()<\/script>';
    d.getElementById('d-due').value = '2026-12-25';
    await saveSheet();

    const saved = store()[0];
    ok('sheet closes on save', d.getElementById('details').open === false);
    ok('title is saved and trimmed', saved.title === 'Round trip renamed');
    ok('notes are sanitised', saved.notes === '<p>hello <strong>world</strong></p>');
    ok('script tags never reach storage', !/bad\(\)/.test(saved.notes));
    ok('target date is saved', saved.due === '2026-12-25');

    const meta = d.querySelector('.item .meta').textContent;
    ok('row shows a notes chip', /Notes/.test(meta));
    ok('row shows the date', /Dec 25/.test(meta));

    // Cancel must discard.
    await openDetails();
    d.getElementById('d-title').value = 'should not stick';
    d.getElementById('sheet-cancel').click();
    await wait(80);
    ok('cancel discards edits', store()[0].title === 'Round trip renamed');

    // Clearing the date.
    await openDetails();
    d.getElementById('d-due-clear').click();
    await saveSheet();
    ok('the date can be cleared', store()[0].due === null);

    // A blank title must not wipe the task.
    await openDetails();
    d.getElementById('d-title').value = '   ';
    await saveSheet();
    ok('a blank title keeps the old one', store()[0].title === 'Round trip renamed');

    // Date grouping and separators.
    await openDetails();
    d.getElementById('d-due').value = '2026-12-25';
    await saveSheet();
    d.getElementById('input').value = 'Undated task';
    d.getElementById('composer').dispatchEvent(new w.Event('submit', { cancelable: true }));
    await wait(60);

    const heads = [...d.querySelectorAll('.group-head span:first-child')]
      .map((e) => e.textContent.trim());
    ok('two dates produce two separators', heads.length === 2);
    ok('the dated group is labelled by its date', /Dec 25/.test(heads[0]));
    ok('the undated group sorts last', heads[1] === 'No date');
    ok('separator shows a count', d.querySelector('.group-count').textContent.trim() === '1');
    ok(
      'a grouped row drops the now-redundant date chip',
      !/Dec 25/.test(d.querySelector('.group .item .meta').textContent),
    );

    // A single group needs no separator.
    d.querySelector('.group:last-child .item [data-act="remove"]').click();
    await wait(60);
    ok('one group renders no separator', d.querySelectorAll('.group-head').length === 0);
    ok('an ungrouped row shows its date again', /Dec 25/.test(d.querySelector('.item .meta').textContent));

    // The point of the zustand persist layer: survive a full reload.
    const beforeReload = store().map((t) => t.title).sort();
    await new Promise((done) => { f.onload = done; f.contentWindow.location.reload(); });
    await wait(150);
    const d2 = f.contentDocument;
    ok('tasks survive a reload', JSON.stringify(store().map((t) => t.title).sort()) === JSON.stringify(beforeReload));
    ok('the reloaded list renders them', d2.querySelectorAll('.item').length === beforeReload.length);

    out.textContent = log.join('\n');
  } catch (err) {
    out.textContent = `${log.join('\n')}\nFAIL threw: ${err.message}`;
  }
};

f.src = '/index.html';
</script>
