<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fafaf9" id="theme-color" />
<meta name="description" content="A simple, mobile-first to-do list. Nothing leaves this tab." />
<title>Todo</title>
<link rel="stylesheet" href="src/styles.css" />
<script>
  // Applied before first paint so an override never flashes the other theme.
  try {
    var t = localStorage.getItem('todo-app:theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>✓</text></svg>" />
</head>
<body>
  <!-- Flat icon sprite: single-weight stroke icons, no fills. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5" /></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.5 2.5 0 0 0-3.5-3.5L4 16.5V20Z" /></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5M10.5 10.5v6M13.5 10.5v6" /></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.25" /><path d="M12 2.5v2.25M12 19.25v2.25M4.22 4.22l1.6 1.6M18.18 18.18l1.6 1.6M2.5 12h2.25M19.25 12h2.25M4.22 19.78l1.6-1.6M18.18 5.82l1.6-1.6" /></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.8A8.75 8.75 0 0 1 9.2 3.5a8.75 8.75 0 1 0 11.3 11.3Z" /></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 4.5h12v15H6zM9 9h6M9 12.5h6M9 16h3.5" /></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M4.5 6.5h15v13h-15zM4.5 10.5h15M8.5 3.5v3M15.5 3.5v3" /></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9.5 5.5 7 6.5-7 6.5" /></symbol>
    <symbol id="i-ul" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" /></symbol>
    <symbol id="i-ol" viewBox="0 0 24 24"><path d="M10 6.5h10M10 12h10M10 17.5h10M4 5h1.5v4M4 9h3M4 13.5h3v2H4.5v2H7" /></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13h4l1.5 3h5L16 13h4M4 13l2.5-7h11L20 13v5.5H4V13Z" /></symbol>
  </svg>

  <div class="app">
    <header class="header">
      <div class="header-row">
        <h1>Today</h1>
        <div class="header-side">
          <p class="date" id="date"></p>
          <button class="theme" id="theme" type="button">
            <svg class="icon" aria-hidden="true"><use id="theme-icon" href="#i-moon" /></svg>
          </button>
        </div>
      </div>
      <p class="count" id="count">Nothing yet</p>

      <nav class="filters" id="filters" role="tablist" aria-label="Filter tasks">
        <button class="filter" role="tab" data-filter="all" aria-selected="true">All</button>
        <button class="filter" role="tab" data-filter="active" aria-selected="false">Active</button>
        <button class="filter" role="tab" data-filter="done" aria-selected="false">Done</button>
      </nav>
    </header>

    <main class="main">
      <ul class="list" id="list" aria-label="Tasks"></ul>

      <div class="empty" id="empty" hidden>
        <svg class="icon icon-lg" aria-hidden="true"><use href="#i-inbox" /></svg>
        <p class="empty-title" id="empty-title">No tasks yet</p>
        <p class="empty-sub" id="empty-sub">Add one below to get started.</p>
      </div>

      <button class="clear" id="clear" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
        Clear completed
      </button>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <input
        class="input"
        id="input"
        type="text"
        name="task"
        placeholder="Add a task"
        aria-label="Add a task"
        maxlength="200"
        enterkeyhint="done"
      />
      <button class="add" id="add" type="submit" aria-label="Add task">
        <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
      </button>
    </form>
  </div>

  <dialog class="sheet" id="details" aria-labelledby="sheet-title">
    <form class="sheet-form" id="details-form" method="dialog">
      <header class="sheet-head">
        <h2 id="sheet-title" tabindex="-1" autofocus>Details</h2>
        <button class="act" id="sheet-close" type="button" aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
        </button>
      </header>

      <div class="sheet-body">
        <label class="field">
          <span class="field-label">Task</span>
          <input class="input field-input" id="d-title" type="text" maxlength="200"
                 autocomplete="off" enterkeyhint="done" />
        </label>

        <div class="field">
          <span class="field-label" id="d-notes-label">Description</span>
          <div class="rt">
            <div class="rt-bar" id="rt-bar" role="toolbar" aria-label="Text formatting">
              <button class="rt-btn" type="button" data-cmd="bold" aria-label="Bold" aria-pressed="false"><b>B</b></button>
              <button class="rt-btn" type="button" data-cmd="italic" aria-label="Italic" aria-pressed="false"><i>I</i></button>
              <button class="rt-btn" type="button" data-cmd="underline" aria-label="Underline" aria-pressed="false"><u>U</u></button>
              <button class="rt-btn" type="button" data-cmd="strikeThrough" aria-label="Strikethrough" aria-pressed="false"><s>S</s></button>
              <span class="rt-sep" aria-hidden="true"></span>
              <button class="rt-btn" type="button" data-cmd="insertUnorderedList" aria-label="Bulleted list" aria-pressed="false">
                <svg class="icon" aria-hidden="true"><use href="#i-ul" /></svg>
              </button>
              <button class="rt-btn" type="button" data-cmd="insertOrderedList" aria-label="Numbered list" aria-pressed="false">
                <svg class="icon" aria-hidden="true"><use href="#i-ol" /></svg>
              </button>
            </div>
            <div class="rt-body is-empty" id="d-notes" contenteditable="true" role="textbox"
                 aria-multiline="true" aria-labelledby="d-notes-label"
                 data-placeholder="Add more detail…"></div>
          </div>
        </div>

        <div class="field">
          <span class="field-label" id="d-due-label">Target date</span>
          <div class="date-row">
            <input class="input field-input" id="d-due" type="date" aria-labelledby="d-due-label" />
            <button class="act" id="d-due-clear" type="button" aria-label="Clear target date">
              <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
            </button>
          </div>
        </div>
      </div>

      <footer class="sheet-foot">
        <button class="btn" id="sheet-cancel" type="button">Cancel</button>
        <button class="btn primary" type="submit" value="save">Save</button>
      </footer>
    </form>
  </dialog>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <script type="module" src="src/app.js"></script>
</body>
</html>
